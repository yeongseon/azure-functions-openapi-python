name: Publish to PyPI

on:
  # Release Please tags the release commit; that tag starts this workflow, which
  # is the single gated path to PyPI. Azure certification runs as the azure-e2e
  # job below, so publication cannot outrun verification.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish (for example v0.21.1)
        required: true
        type: string

permissions:
  contents: read

# Verify-before-publish gate (see AGENTS.md):
#   build -> lib-tests -> cookbook-smoke -> cookbook-host-smoke
#         -> azure-e2e -> publish
# Tiered runtime verification before any PyPI upload:
#   * lib-tests            : the library's own unit suite, run from a source checkout via
#                            `hatch run test` (not against the built wheel; the candidate-wheel
#                            tiers are cookbook-smoke and cookbook-host-smoke below).
#   * cookbook-smoke       : install the candidate wheel into the cookbook, then run downstream
#                            module-import checks (catches registration/import drift).
#   * cookbook-host-smoke  : install the candidate wheel into the cookbook, then boot a real func
#                            host + Azurite and run the cookbook HTTP e2e. This proves the candidate
#                            installs cleanly and the Functions host starts with it present in the
#                            environment. NOTE: the cookbook HTTP examples do not import this package,
#                            so this tier is a host-boot smoke, NOT proof of this package's own runtime
#                            behavior. Package-native runtime coverage is tracked separately.
#   * azure-e2e            : calls e2e-azure.yml to deploy to real Azure and run the live e2e suite
#                            against the tag being published. Because it runs inside this chain at
#                            the same ref, certification covers the exact published commit by
#                            construction -- no cross-run SHA/freshness matching is required.
# The publish job uploads the EXACT artifact that was tested; it never rebuilds.
# A tag whose gate fails is a failed release candidate: the version stays
# unpublished. Recover by fixing forward and cutting the next patch tag
# (never move a tag that may already have been consumed).
jobs:
  build:
    name: Build & verify version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Check if tag matches __version__
        id: version
        run: |
          TAG_NAME="${{ inputs.tag || github.ref_name }}"
          VERSION_FROM_FILE=$(grep -Po '(?<=__version__ = ")[^"]*' src/azure_functions_openapi/__init__.py)
          TAG_VERSION=${TAG_NAME#v}
          echo "Version from file: $VERSION_FROM_FILE"
          echo "Tag name: $TAG_NAME"
          echo "Version from tag: $TAG_VERSION"
          if [ "$VERSION_FROM_FILE" != "$TAG_VERSION" ]; then
            echo "::error ::Version in __init__.py ($VERSION_FROM_FILE) does not match git tag ($TAG_VERSION)"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: Build distribution packages
        run: python -m build

      - name: Upload distribution artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 5

  lib-tests:
    name: Library tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Hatch
        run: pip install hatch

      - name: Run test suite
        run: hatch run test

  cookbook-smoke:
    name: Cookbook dogfood smoke (candidate wheel)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cookbook (downstream consumer)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yeongseon/azure-functions-cookbook-python
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Download candidate wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: candidate-dist

      - name: Install cookbook environment
        run: |
          pip install hatch
          make install

      - name: Install candidate wheel over the PyPI floor
        run: |
          WHEEL=$(ls candidate-dist/*.whl | head -n1)
          echo "Installing candidate wheel: $WHEEL"
          hatch run pip install --force-reinstall --no-deps "$WHEEL"

      - name: Verify candidate version is under test
        run: |
          EXPECTED="${{ needs.build.outputs.version }}"
          ACTUAL=$(hatch run python -c "import importlib.metadata as m; print(m.version('azure-functions-openapi'))")
          echo "Expected candidate version: $EXPECTED"
          echo "Installed version:          $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error ::Cookbook is not exercising the candidate wheel ($ACTUAL != $EXPECTED)"
            exit 1
          fi

      - name: Run cookbook smoke tests against candidate
        run: hatch run smoke

  cookbook-host-smoke:
    name: Cookbook host-boot smoke (func + Azurite, candidate wheel)
    needs: build
    runs-on: ubuntu-latest
    env:
      # Pin Core Tools; bump only after a verified run. npm is Microsoft's
      # documented v4 install path (see e2e-azure.yml for rationale).
      FUNCTIONS_CORE_TOOLS_VERSION: "4.12.0"
    steps:
      - name: Checkout cookbook (downstream consumer)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: yeongseon/azure-functions-cookbook-python
          ref: main

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up Node.js (func Core Tools + Azurite)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install Azure Functions Core Tools + Azurite
        run: |
          npm install -g "azure-functions-core-tools@${FUNCTIONS_CORE_TOOLS_VERSION}" azurite
          func --version
          azurite --version

      - name: Download candidate wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: candidate-dist

      - name: Install cookbook environment
        run: |
          pip install hatch
          make install

      - name: Install candidate wheel over the PyPI floor
        run: |
          WHEEL=$(ls candidate-dist/*.whl | head -n1)
          echo "Installing candidate wheel: $WHEEL"
          hatch run pip install --force-reinstall --no-deps "$WHEEL"

      - name: Verify candidate version is under test
        run: |
          EXPECTED="${{ needs.build.outputs.version }}"
          ACTUAL=$(hatch run python -c "import importlib.metadata as m; print(m.version('azure-functions-openapi'))")
          echo "Expected candidate version: $EXPECTED"
          echo "Installed version:          $ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error ::Cookbook is not exercising the candidate wheel ($ACTUAL != $EXPECTED)"
            exit 1
          fi

      - name: Boot cookbook func host with candidate wheel (host-smoke)
        run: hatch run e2e tests/e2e/test_http_examples.py
        timeout-minutes: 15

  azure-e2e:
    name: Azure release certification
    needs: build
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/e2e-azure.yml
    with:
      ref: ${{ needs.build.outputs.tag }}
      version: ${{ needs.build.outputs.version }}
    secrets:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}


  publish:
    name: Publish to PyPI
    needs: [build, lib-tests, cookbook-smoke, cookbook-host-smoke, azure-e2e]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download tested distribution artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1 # pin-exempt: PyPA official publisher (trusted-publisher OIDC); tracks release/v1 by design


  notify-cookbook:
    name: Trigger cookbook e2e re-verification
    needs: [build, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch sibling-release to cookbook
        env:
          VERSION: ${{ needs.build.outputs.version }}
          # Cross-repo repository_dispatch needs a token with contents:write on the
          # cookbook repo (GITHUB_TOKEN cannot cross repositories). Supply a
          # fine-grained token scoped to azure-functions-cookbook-python
          # contents:write (or a GitHub App token) via COOKBOOK_DISPATCH_TOKEN.
          # Scoped to this step so no other step in the job can read it; when the
          # secret is unset the dispatch is skipped, so missing wiring never fails
          # a release.
          DISPATCH_TOKEN: ${{ secrets.COOKBOOK_DISPATCH_TOKEN }}
        run: |
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "COOKBOOK_DISPATCH_TOKEN not set; skipping cross-repo dispatch."
            exit 0
          fi
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/yeongseon/azure-functions-cookbook-python/dispatches \
            -d "{\"event_type\":\"sibling-release\",\"client_payload\":{\"library\":\"azure-functions-openapi\",\"version\":\"${VERSION}\"}}"
