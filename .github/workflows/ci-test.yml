name: Test and Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Python 3.14 is stable and required in this matrix (not allow-fail).
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # 'latest' resolves whatever satisfies the pyproject.toml pin at CI time.
        azure-functions-version: ["latest"]
        include:
          # Extra SDK-version coverage on the lowest supported Python.
          # Keep in sync with the SDK compatibility matrix in README.md and
          # the version pin in pyproject.toml.
          - python-version: "3.10"
            azure-functions-version: "1.21.0"
          - python-version: "3.10"
            azure-functions-version: "1.24.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch and dependencies via Makefile
        run: |
          pip install hatch
          make install

      - name: Install azure-functions ${{ matrix.azure-functions-version }}
        run: |
          if [ "${{ matrix.azure-functions-version }}" = "latest" ]; then
            # Mirror the pyproject.toml constraint so 'latest' cannot install azure-functions 2.x when it releases (see README SDK Compatibility).
            .venv/bin/hatch run pip install --upgrade 'azure-functions>=1.21.0,<2.0.0'
          else
            .venv/bin/hatch run pip install --upgrade 'azure-functions==${{ matrix.azure-functions-version }}'
          fi
          .venv/bin/hatch run python -c "import azure.functions, importlib.metadata as m; print('azure-functions installed:', m.version('azure-functions'))"

      - name: Install azure-functions-validation (run bridge/validation example tests on one cell)
        # These example tests are skipif-guarded on the optional azure-functions-validation
        # import. Install it on a single matrix cell so they actually execute in CI (see #275).
        if: matrix.python-version == '3.12' && matrix.azure-functions-version == 'latest'
        run: |
          .venv/bin/hatch run pip install --upgrade 'azure-functions-validation>=0.7.0'
          .venv/bin/hatch run python -c "import azure_functions_validation, importlib.metadata as m; print('azure-functions-validation installed:', m.version('azure-functions-validation'))"

      - name: Run full quality checks
        run: make check-all

      - name: Verify coverage output
        run: ls -lh coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.10' && matrix.azure-functions-version == 'latest' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          verbose: true
          fail_ci_if_error: false
        env:
          CODECOV_RETRIES: 3

  # azure-functions 2.x compatibility proof lane (issues #488 / #528),
  # following the sibling proof-lane pattern (azure-functions-validation #351 /
  # azure-functions-langgraph #350). It installs the package from a WHEEL, then
  # pulls `azure-functions>=2,<3` and runs the full quality suite against the
  # 2.x SDK on real Python 3.13 AND 3.14 interpreters.
  #
  # Why a wheel + dedicated job (not the main matrix): the hatch `default` env is
  # pinned to Python 3.10 in pyproject, so every cell of the `test` matrix runs
  # Python 3.10 at runtime regardless of its `python-version`. Only this
  # non-hatch, wheel-installed lane genuinely exercises 3.13/3.14, which is
  # exactly where azure-functions 2.x (Requires-Python >=3.13) is installable.
  #
  # Gating: this lane runs on every PR as a VISIBLE compatibility signal. The
  # pyproject cap is interpreter-aware (2.x is allowed on Python 3.13+), and the
  # two version-pin guard tests are likewise interpreter-aware, so they run
  # (not deselected) and actively prove 2.x is permitted on 3.13+. Promote to a
  # required check via branch protection once real-Azure certification lands.
  azure-functions-2x:
    name: azure-functions 2.x compat (Py ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        # Prove 2.x against a WHEEL-installed build, not an editable/source
        # tree, mirroring the sibling proof lanes (azure-functions-validation
        # #351 / azure-functions-langgraph #350). Building the distribution
        # artifact also avoids hatch's default env, which is pinned to Python
        # 3.10 in pyproject and cannot install azure-functions 2.x (Requires-
        # Python >=3.13).
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install wheel with dev extras
        run: pip install "$(ls dist/azure_functions_openapi-*.whl)[dev]"

      - name: Upgrade azure-functions to the 2.x line
        # pyproject caps azure-functions <2.0.0 until 2.x is certified on real
        # Azure. This lane deliberately overrides that cap to PROVE the package
        # (route discovery adapter, spec generation) still builds and passes its
        # suite under 2.x. pip warns about the intentional override; expected.
        run: pip install "azure-functions>=2,<3"

      - name: Show resolved versions
        run: pip show azure-functions pydantic | grep -E '^(Name|Version):'

      - name: Run compat suite against the wheel + azure-functions 2.x
        # Compatibility smoke only: `--no-cov` disables the coverage gate for
        # this pinned run (a separate job from the coverage-enforcing matrix).
        # The repo pytest config sets `pythonpath = ["src", "."]`, which would
        # shadow the installed wheel with the source tree. We drop `src` (so the
        # wheel-installed package is genuinely exercised) but keep the repo root
        # `.` on the path, because several tests import the `examples` package.
        # All version-pin guards are now interpreter-aware: on Python 3.13+ they
        # assert only the >=1.21.0 floor (the <2.0.0 ceiling is lifted per issue
        # #528), so they RUN here and actively prove 2.x is permitted. The
        # `FunctionBuilder._function` private-attribute tripwires also run,
        # proving the adapter surface holds under azure-functions 2.x.
        run: |
          pytest tests/ --no-cov -q -o "pythonpath=."

