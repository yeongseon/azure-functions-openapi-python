name: Test and Coverage

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      docs_changed: ${{ steps.classify.outputs.docs_changed }}
      full_required: ${{ steps.classify.outputs.full_required }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && github.event.pull_request.base.sha || github.event.pull_request.head.sha || github.sha }}

      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          fail_safe() {
            printf 'docs_only=false\ndocs_changed=true\nfull_required=true\n' >> "$GITHUB_OUTPUT"
          }
          fail_safe

          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
              git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head:refs/remotes/pull/head" || exit 0
              HEAD_SHA=refs/remotes/pull/head
            fi
            if ! git cat-file -e "${BASE_SHA}^{commit}" \
              || ! git cat-file -e "${HEAD_SHA}^{commit}" \
              || ! git diff --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}" > changed-files.txt; then
              exit 0
            fi
          else
            if [ -z "$BEFORE_SHA" ] \
              || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "${BEFORE_SHA}^{commit}" \
              || ! git cat-file -e "${SHA}^{commit}" \
              || ! git merge-base --is-ancestor "$BEFORE_SHA" "$SHA" \
              || ! git diff --name-only --no-renames "$BEFORE_SHA" "$SHA" > changed-files.txt; then
              exit 0
            fi
          fi

          tools/ci_classify_changes.sh < changed-files.txt >> "$GITHUB_OUTPUT" || exit 0

  # Lint, type-check and security run once on a single pinned interpreter
  # (Python 3.11, matching the mypy/ruff target-version in pyproject). These
  # checks are interpreter-agnostic, so fanning them across the matrix would
  # only duplicate work.
  quality:
    name: Lint, type-check & security (Py 3.11)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR can branch before the base tip; its merge-base needs full history.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint workflows (pin hygiene + release-gate canonical SHAs)
        run: |
          python tools/lint_release_workflows.py
          python tools/lint_workflow_pins.py
          python tools/lint_hatch_matrix.py

      - name: Ruff style check
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Ruff format check (changed Python files)
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tools/check_pr_format.py "$PR_BASE_SHA" "$PR_HEAD_SHA"

      - name: Type check (mypy, strict)
        run: mypy src tests

  test:
    name: Test (Py ${{ matrix.python-version }}, af ${{ matrix.azure-functions-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Run the full suite on every declared Python version. The package's
        # environment markers resolve azure-functions 1.x on 3.11-3.12 and
        # permit 2.x on 3.13-3.14; the dedicated wheel lanes below separately
        # prove that the built distribution works against the 2.x line.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # 'latest' resolves whatever satisfies the pyproject.toml pin at CI time.
        azure-functions-version: ["latest"]
        include:
          # Extra SDK-version coverage on the lowest supported Python.
          # Keep in sync with the SDK compatibility matrix in README.md and
          # the version pin in pyproject.toml.
          - python-version: "3.11"
            azure-functions-version: "1.21.0"
          - python-version: "3.11"
            azure-functions-version: "1.24.0"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Assert the runtime interpreter matches the matrix cell
        # Tests must run on the interpreter this cell claims to exercise. Before
        # #554 the whole matrix ran through the default pinned Hatch env, so
        # 3.11/3.12 were never actually tested. This guard fails loudly if the
        # running interpreter ever drifts from matrix.python-version again.
        env:
          EXPECTED: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import os, sys
          expected = tuple(int(p) for p in os.environ["EXPECTED"].split("."))
          actual = sys.version_info[: len(expected)]
          assert actual == expected, f"interpreter {actual} != matrix {expected}"
          print(f"interpreter OK: {sys.version.split()[0]}")
          PY

      - name: Install package with dev extras (on the matrix interpreter)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install azure-functions ${{ matrix.azure-functions-version }}
        run: |
          if [ "${{ matrix.azure-functions-version }}" = "latest" ]; then
            if [[ "${{ matrix.python-version }}" == 3.1[34] ]]; then
              pip install --upgrade 'azure-functions>=2.0.0,<3.0.0'
            else
              pip install --upgrade 'azure-functions>=1.21.0,<2.0.0'
            fi
          else
            pip install --upgrade 'azure-functions==${{ matrix.azure-functions-version }}'
          fi
          python -c "import azure.functions, importlib.metadata as m; print('azure-functions installed:', m.version('azure-functions'))"

      - name: Install azure-functions-validation (run bridge/validation example tests)
        # These example tests are skipif-guarded on the optional dependency.
        # Install it in every latest-SDK cell so each Python lane exercises the
        # integration; pinned legacy-SDK cells remain focused compatibility probes.
        if: matrix.azure-functions-version == 'latest'
        run: |
          pip install --upgrade 'azure-functions-validation>=0.7.0'
          python -c "import azure_functions_validation, importlib.metadata as m; print('azure-functions-validation installed:', m.version('azure-functions-validation'))"

      - name: Run tests on the matrix interpreter
        # Raw pytest on the interpreter provisioned above (NOT through the
        # default pinned Hatch env). The repo pytest config enables --cov
        # with fail_under=95, but only the 3.11 x latest cell collects the full
        # suite. Enforce the coverage gate on the
        # canonical 3.11 x latest cell and run the rest with --no-cov so a
        # version-variant cell cannot fail the build on a spurious coverage dip.
        env:
          IS_COVERAGE_CELL: ${{ matrix.python-version == '3.11' && matrix.azure-functions-version == 'latest' }}
        run: |
          if [ "$IS_COVERAGE_CELL" = "true" ]; then
            pytest tests/
          else
            pytest tests/ --no-cov
          fi

      - name: Verify coverage output
        if: matrix.python-version == '3.11' && matrix.azure-functions-version == 'latest'
        run: ls -lh coverage.xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && matrix.azure-functions-version == 'latest' && github.actor != 'dependabot[bot]'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          verbose: true
          fail_ci_if_error: false
        env:
          CODECOV_RETRIES: 3

  docs-check:
    name: Documentation checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install docs and test dependencies
        run: pip install -e ".[docs]" pytest pytest-cov

      - name: Lint Mermaid diagram labels
        run: python scripts/lint_mermaid.py

      - name: Check screenshot manifest
        run: python scripts/check_screenshots.py --strict

      - name: Test screenshot manifest behavior
        run: pytest tests/test_screenshot_manifest.py --no-cov

      - name: Build docs (strict)
        run: mkdocs build --strict

  # The single required status check for branch protection.
  #
  # Branch protection matches required checks by literal name, so requiring
  # matrix cells (`Test (Py 3.10, af latest)`, ...) couples it to the matrix:
  # dropping a version removes the job that produced that name, the check is
  # then never reported, and GitHub holds it pending forever -- blocking every
  # PR, Dependabot and Release Please included, until an admin edits settings.
  #
  # This job's name survives matrix changes. `if: always()` guarantees it
  # reports, and a skipped or cancelled dependency is not success, so it cannot
  # pass by being skipped.
  ci-required:
    needs:
      - changes
      - docs-check
      - quality
      - test
      - minimum-dependencies
      - artifact-build
      - artifact-python310-negative
      - artifact-python311
      - azure-functions-2x
      - host-smoke
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required checks
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          for name, job in needs.items():
              print(f"{name}: {job['result']}")

          changes = needs["changes"]
          docs_changed = changes.get("outputs", {}).get("docs_changed", "")
          full_required = changes.get("outputs", {}).get("full_required", "")
          if docs_changed not in {"true", "false"} or full_required not in {"true", "false"}:
              sys.exit("classifier outputs must be exactly true or false")
          if docs_changed == "false" and full_required == "false":
              sys.exit("classifier selected no CI work")

          expected = {
              "changes": "success",
              "docs-check": "success" if docs_changed == "true" else "skipped",
          }
          full_jobs = {
              "quality",
              "test",
              "minimum-dependencies",
              "artifact-build",
              "artifact-python310-negative",
              "artifact-python311",
              "azure-functions-2x",
              "host-smoke",
          }
          expected.update(
              {name: "success" if full_required == "true" else "skipped" for name in full_jobs}
          )
          failures = [
              f"{name}={job['result']} (expected {expected.get(name, 'success')})"
              for name, job in needs.items()
              if job["result"] != expected.get(name, "success")
          ]
          if failures:
              sys.exit("unexpected required results: " + ", ".join(failures))
          PY
          echo "All required jobs matched their classification expectations."

  minimum-dependencies:
    name: Minimum dependencies (Py 3.11)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install minimum runtime and development dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "azure-functions==1.21.0"
          pip install -e ".[dev]"

      - name: Assert the declared azure-functions floor is resolved
        run: |
          pip show azure-functions azure-functions-openapi
          python - <<'PY'
          from importlib.metadata import version

          resolved = version("azure-functions")
          print(f"resolved azure-functions={resolved}")
          assert resolved == "1.21.0"
          PY

      - name: Run full suite against minimum runtime dependencies
        run: pytest tests/ --no-cov

  artifact-build:
    name: Build compatibility artifacts
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload compatibility artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatibility-dist
          path: dist/
          if-no-files-found: error

  artifact-python310-negative:
    name: Wheel install rejection (Py 3.10, negative test)
    needs: [changes, artifact-build]
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.10 for negative install test
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compatibility-dist
          path: compatibility-dist

      - name: Require wheel rejection by Requires-Python
        run: |
          wheel=$(find compatibility-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          if output=$(python -m pip install --no-deps "$wheel" 2>&1); then
            echo "::error ::Python 3.10 unexpectedly installed the candidate wheel"
            exit 1
          fi
          printf '%s\n' "$output"
          grep -F "requires a different Python" <<<"$output"
          grep -F "3.10" <<<"$output"
          grep -F ">=3.11" <<<"$output"

  artifact-python311:
    name: Wheel install and smoke (Py 3.11)
    needs: [changes, artifact-build]
    if: needs.changes.outputs.full_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: compatibility-dist
          path: compatibility-dist

      - name: Install wheel with runtime dependencies
        run: |
          wheel=$(find compatibility-dist -maxdepth 1 -name '*.whl' -print -quit)
          test -n "$wheel"
          python -m pip install "$wheel"

      - name: Check installed wheel outside the checkout
        working-directory: /tmp
        env:
          CHECKOUT: ${{ github.workspace }}
        run: |
          python -m pip check
          python - <<'PY'
          import os
          from pathlib import Path

          import azure.functions as func
          import azure_functions_openapi
          from azure_functions_openapi import generate_openapi_spec, openapi, scan_endpoint_metadata

          module_path = Path(azure_functions_openapi.__file__).resolve()
          checkout = Path(os.environ["CHECKOUT"]).resolve()
          print(f"imported module: {module_path}")
          assert not module_path.is_relative_to(checkout)

          app = func.FunctionApp()

          @openapi(summary="Artifact smoke", responses={200: {"description": "OK"}})
          @app.route(route="artifact-smoke", methods=["GET"])
          def artifact_smoke(req: func.HttpRequest) -> func.HttpResponse:
              return func.HttpResponse("ok")

          scan_endpoint_metadata(app)
          spec = generate_openapi_spec()
          assert "/api/artifact-smoke" in spec["paths"]
          assert spec["paths"]["/api/artifact-smoke"]["get"]
          PY

  host-smoke:
    name: Real Functions host smoke (Py ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tests/host_smoke/requirements.txt

      - name: Install Functions Core Tools v4 and smoke app
        run: |
          npm install --global azure-functions-core-tools@4 --unsafe-perm true
          python -m venv tests/host_smoke/.venv
          tests/host_smoke/.venv/bin/python -m pip install --upgrade pip
          cd tests/host_smoke
          .venv/bin/python -m pip install -r requirements.txt

      - name: Exercise OpenAPI routes on a real Functions host
        run: |
          npx --yes azurite --silent > "$RUNNER_TEMP/azurite.log" 2>&1 &
          azurite_pid=$!
          trap 'kill "$azurite_pid" "$host_pid" 2>/dev/null || true' EXIT

          cd tests/host_smoke
          export PATH="$PWD/.venv/bin:$PATH"
          timeout 120s func start --verbose > "$RUNNER_TEMP/host-smoke.log" 2>&1 &
          host_pid=$!

          ready=false
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:7071/api/custom_name \
              --output "$RUNNER_TEMP/custom-route.json"; then
              ready=true
              break
            fi
            if ! kill -0 "$host_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            cat "$RUNNER_TEMP/host-smoke.log"
            echo "::error::The custom-name route did not become ready"
            exit 1
          fi

          python -c 'import json, pathlib; assert json.loads(pathlib.Path("'"$RUNNER_TEMP"'/custom-route.json").read_text()) == {"function_name": "custom_name"}'
          curl --fail --silent http://127.0.0.1:7071/api/openapi.json \
            --output "$RUNNER_TEMP/openapi.json"
          python -c 'import json, pathlib; spec = json.loads(pathlib.Path("'"$RUNNER_TEMP"'/openapi.json").read_text()); assert spec["openapi"] and spec["paths"]'
          curl --fail --silent http://127.0.0.1:7071/api/docs \
            --output "$RUNNER_TEMP/swagger.html"
          grep -q 'SwaggerUIBundle' "$RUNNER_TEMP/swagger.html"

          kill "$host_pid" 2>/dev/null || true
          wait "$host_pid" 2>/dev/null || true
          cat "$RUNNER_TEMP/host-smoke.log"

          if grep -Eq "0 functions (loaded|found \(Worker\))|No job functions found|Executed 'Functions\..*' \(Failed" "$RUNNER_TEMP/host-smoke.log"; then
            echo "::error::The Functions host reported indexing or invocation errors"
            exit 1
          fi

  # azure-functions 2.x compatibility proof lane (issues #488 / #528),
  # following the sibling proof-lane pattern (azure-functions-validation #351 /
  # azure-functions-langgraph #350). It installs the package from a WHEEL, then
  # pulls `azure-functions>=2,<3` and runs the full quality suite against the
  # 2.x SDK on real Python 3.13 AND 3.14 interpreters.
  #
  # Why a wheel + dedicated job (not the main matrix): azure-functions 2.x
  # declares Requires-Python >=3.13, so it is only installable on 3.13/3.14 --
  # interpreters the main `test` matrix proves independently. This lane
  # installs the built wheel directly (no hatch env) on real 3.13 AND 3.14
  #
  # Gating: this lane runs on every PR as a VISIBLE compatibility signal. The
  # pyproject cap is interpreter-aware (2.x is allowed on Python 3.13+), and the
  # two version-pin guard tests are likewise interpreter-aware, so they run
  # (not deselected) and actively prove 2.x is permitted on 3.13+. This lane is
  # gating: `ci-required` fails unless it succeeds, so it no longer depends on
  # its two matrix-cell names being listed in branch protection.
  azure-functions-2x:
    name: azure-functions 2.x compat (Py ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.full_required == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build wheel
        # Prove 2.x against a WHEEL-installed build, not an editable/source
        # tree, mirroring the sibling proof lanes (azure-functions-validation
        # #351 / azure-functions-langgraph #350). Building the distribution
        # artifact also avoids hatch's default env, which is pinned to Python
    # 3.11 in pyproject and cannot install azure-functions 2.x (Requires-
        # Python >=3.13).
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Install wheel with dev extras
        run: pip install "$(ls dist/azure_functions_openapi-*.whl)[dev]"

      - name: Upgrade azure-functions to the 2.x line
        # pyproject's azure-functions cap is interpreter-aware: <2.0.0 on Python
        # <3.13 and <3.0.0 on Python 3.13+ (2.x is certified on real Azure). On
        # the 3.13/3.14 interpreters this lane runs, 2.x is already permitted; the
        # explicit >=2,<3 install just pins the 2.x line under test. pip may warn
        # about resolving to 2.x; expected.
        run: pip install "azure-functions>=2,<3"

      - name: Show resolved versions
        run: pip show azure-functions pydantic | grep -E '^(Name|Version):'

      - name: Run compat suite against the wheel + azure-functions 2.x
        # Compatibility smoke only: `--no-cov` disables the coverage gate for
        # this pinned run (a separate job from the coverage-enforcing matrix).
        # The repo pytest config sets `pythonpath = ["src", "."]`, which would
        # shadow the installed wheel with the source tree. We drop `src` (so the
        # wheel-installed package is genuinely exercised) but keep the repo root
        # `.` on the path, because several tests import the `examples` package.
        # All version-pin guards are now interpreter-aware: on Python 3.13+ they
        # assert only the >=1.21.0 floor (the <2.0.0 ceiling is lifted per issue
        # #528), so they RUN here and actively prove 2.x is permitted. The
        # `FunctionBuilder._function` private-attribute tripwires also run,
        # proving the adapter surface holds under azure-functions 2.x.
        run: |
          pytest tests/ --no-cov -q -o "pythonpath=."
