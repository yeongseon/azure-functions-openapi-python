name: Release Please

# Release-decision layer. Owns version calculation, CHANGELOG.md, the Release PR,
# the tag, and the GitHub Release. It does not publish.
#
#   Conventional-Commit PRs -> main
#        |
#   Release Please  ->  Release PR (version bump + CHANGELOG)
#        |  maintainer merges
#   release commit  ->  tag vX.Y.Z  +  GitHub Release
#        |
#   publish-pypi.yml (started by the tag)
#        build -> lib-tests -> cookbook-smoke -> cookbook-host-smoke
#              -> azure-e2e -> PyPI
#
# RELEASE_PLEASE_TOKEN (a fine-grained PAT) is load-bearing, not a convenience.
# The default GITHUB_TOKEN cannot trigger other workflows, which would mean
# (a) the Release PR never runs the required status checks and so could never be
# merged, and (b) the tag would not start publish-pypi.yml.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Maintain Release PR / cut release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summarize
        if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          {
            echo "### Released \`$RELEASE_TAG\`"
            echo
            echo "Commit: \`$RELEASE_SHA\`"
            echo
            echo "The tag has started **Publish to PyPI**, which runs the full gate"
            echo "(build, lib-tests, cookbook smoke, host smoke, real-Azure e2e) before"
            echo "uploading. Nothing reaches PyPI until every tier passes."
          } >> "$GITHUB_STEP_SUMMARY"

  # Presentation layer only. Rewrites the body of the GitHub Release that Release
  # Please just created into the standard layout (docs/release_process.md) and adds
  # verified external-contributor credit (not routine owner bylines). It never moves tags or edits
  # CHANGELOG.md and runs independently of publish-pypi.yml, so a failure here can
  # not block or alter a release. tools/release_notes.py refuses to write if the
  # new body would drop a PR/commit reference the Release Please body contained.
  standardize-release-notes:
    name: Standardize GitHub Release notes
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rewrite release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: python3 -m tools.release_notes apply "$RELEASE_TAG"
        continue-on-error: true

  # Pre-release validation. Read-only. Release Please has just tagged the release commit and
  # created the GitHub Release; before anyone relies on that tag, check that the tagged source
  # declares the tag's version, that the commit is on main and that CHANGELOG.md has its section
  # (tools/release_audit.py). It never moves a tag or edits the Release. A failure turns this run
  # red and the job summary says what to do (docs/release_process.md). Like the notes job it is
  # independent of publish-pypi.yml, so it cannot block or alter a release; publishing is gated
  # there and separately fails on a version mismatch.
  verify-release-tag:
    name: Verify release tag
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the tagged source, mainline history and changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if python3 -m tools.release_audit check-tag "$RELEASE_TAG" --wait-seconds 60 2> problems.txt; then
            exit 0
          fi
          cat problems.txt >&2
          {
            echo "### Release tag \`$RELEASE_TAG\` failed validation"
            echo
            sed 's/^/- /' problems.txt
            echo
            echo "The tag and GitHub Release exist, but this tag is not a trustworthy release."
            echo "Do not move or delete the tag. Publishing is gated separately and fails on a"
            echo "version mismatch, so nothing reaches PyPI; fix forward with the next release."
            echo "See docs/release_process.md (Release verification and alerts)."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
