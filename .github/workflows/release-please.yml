name: Release Please

# Release-decision layer. Owns version calculation, CHANGELOG.md, the Release PR,
# the tag, and the GitHub Release. It does not publish.
#
#   Conventional-Commit PRs -> main
#        |
#   Release Please  ->  Release PR (version bump + CHANGELOG)
#        |  maintainer merges
#   release commit  ->  tag vX.Y.Z  +  GitHub Release
#        |
#   publish-pypi.yml (started by the tag)
#        build -> lib-tests -> cookbook-smoke -> cookbook-host-smoke
#              -> azure-e2e -> PyPI
#
# RELEASE_PLEASE_TOKEN (a fine-grained PAT) is load-bearing, not a convenience.
# The default GITHUB_TOKEN cannot trigger other workflows, which would mean
# (a) the Release PR never runs the required status checks and so could never be
# merged, and (b) the tag would not start publish-pypi.yml.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Maintain Release PR / cut release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Summarize
        if: steps.release.outputs.release_created == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          {
            echo "### Released \`$RELEASE_TAG\`"
            echo
            echo "Commit: \`$RELEASE_SHA\`"
            echo
            echo "The tag has started **Publish to PyPI**, which runs the full gate"
            echo "(build, lib-tests, cookbook smoke, host smoke, real-Azure e2e) before"
            echo "uploading. Nothing reaches PyPI until every tier passes."
          } >> "$GITHUB_STEP_SUMMARY"

  # Presentation layer only. Rewrites the body of the GitHub Release that Release
  # Please just created into the standard layout (docs/release_process.md) and adds
  # verified "by @user" credit. It never creates or moves tags, never edits
  # CHANGELOG.md and runs independently of publish-pypi.yml, so a failure here can
  # not block or alter a release. tools/release_notes.py refuses to write if the
  # new body would drop a PR/commit reference the Release Please body contained.
  standardize-release-notes:
    name: Standardize GitHub Release notes
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Rewrite release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: python3 -m tools.release_notes apply "$RELEASE_TAG"
        continue-on-error: true
