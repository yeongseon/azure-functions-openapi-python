name: screenshot-staleness

on:
  pull_request:
    paths:
      - "examples/**"
      - "src/**"
      - "docs/assets/screenshots.yml"
      - "scripts/check_screenshots.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Screenshot manifest check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate manifest and report drift
        run: python scripts/check_screenshots.py check
