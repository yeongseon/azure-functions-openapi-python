name: Generate SBOM

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * 1"

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      # Scanning the checkout inventoried the workflow actions and found no
      # runtime dependency at all. Install the built wheel and scan that
      # environment, so the SBOM describes what users actually receive.
      - name: Build and install the distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          python -m venv .sbom-venv
          .sbom-venv/bin/pip install "$(ls dist/*.whl)"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .sbom-venv
          format: spdx-json
          output-file: sbom.spdx.json

      # Without this the job is green whatever syft produces, which is how the
      # dependency-free SBOM went unnoticed.
      - name: Verify the SBOM describes the distribution
        run: |
          python - <<'PY'
          import json, sys

          packages = {
              p["name"].replace("_", "-").lower()
              for p in json.load(open("sbom.spdx.json"))["packages"]
          }
          missing = {"azure-functions-openapi", "azure-functions"} - packages
          if missing:
              sys.exit(f"::error::SBOM omits {sorted(missing)}; it is not describing the distribution")
          print(f"SBOM describes {len(packages)} packages, including the distribution and its runtime dependencies")
          PY

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.spdx.json
