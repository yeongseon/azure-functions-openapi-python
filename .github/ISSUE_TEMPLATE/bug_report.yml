name: Bug Report
description: Report a bug or unexpected behavior
title: "fix: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe this repository's problem, evidence, and completion criteria.
        Explain why any external project or source is relevant to the work here.
        See [Repository scope](https://github.com/yeongseon/azure-functions-openapi-python/blob/main/AGENTS.md#repository-scope).
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Lead with the observable problem and user impact. Distinguish verified causes from hypotheses.
      placeholder: What is broken or unexpected, and why does it matter?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal reproduction steps with one representative example. Keep long traces or logs in links or collapsed details.
      placeholder: |
        1. Minimal example or code:
        2. Command or trigger:

        Observed:
        Expected:
    validations:
      required: true

  - type: textarea
    id: acceptance-checklist
    attributes:
      label: Acceptance Checklist
      description: Concrete, verifiable items. Use checkboxes - each one should be something a reviewer can confirm is done.
      placeholder: |
        - [ ] The observed behavior no longer occurs and the expected behavior holds
        - [ ] A regression test covers the case
        - [ ] `make check-all` passes
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Environment details if relevant (Python version, OS, package version)
      placeholder: |
        - Python version:
        - azure-functions version:
        - azure-functions-openapi version:
        - OS:
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: Any related issues, PRs, documentation, or links
    validations:
      required: false
