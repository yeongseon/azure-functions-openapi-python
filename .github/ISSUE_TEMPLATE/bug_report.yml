name: Bug Report
description: Report a bug or unexpected behavior
title: "fix: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: textarea
    id: problem
    attributes:
      label: Context
      description: What problem this issue addresses and why now. Include the current behaviour and the impact.
      placeholder: What happened, what you expected, and why it matters now.
    validations:
      required: true

  - type: textarea
    id: current-state
    attributes:
      label: Current State
      description: Describe the current behavior and any relevant context
      placeholder: |
        - What is happening now?
        - Any error messages or logs?
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Install package...
        2. Run command...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected-outcome
    attributes:
      label: Acceptance Checklist
      description: Concrete, verifiable items. Use checkboxes - each one should be something a reviewer can confirm is done.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Your environment details
      placeholder: |
        - Python version:
        - Package version:
        - OS:
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: Any related files, links, or resources
    validations:
      required: false
