name: Task
description: A general task or chore (refactoring, maintenance, etc.)
title: "chore: "
labels: ["chore", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for maintenance tasks, refactoring, or other chores.

  - type: textarea
    id: problem
    attributes:
      label: Context
      description: What problem this issue addresses and why now. Include the current behaviour and the impact.
      placeholder: What happened, what you expected, and why it matters now.
    validations:
      required: true

  - type: textarea
    id: current-state
    attributes:
      label: Current State
      description: What is the current situation?
      placeholder: |
        - Current code/config state
        - Any issues or limitations
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: Break down the work into actionable items
      placeholder: |
        - [ ] Task 1
        - [ ] Task 2
    validations:
      required: true

  - type: textarea
    id: expected-outcome
    attributes:
      label: Acceptance Checklist
      description: Concrete, verifiable items. Use checkboxes - each one should be something a reviewer can confirm is done.
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Any related files, documentation, or resources
    validations:
      required: false
