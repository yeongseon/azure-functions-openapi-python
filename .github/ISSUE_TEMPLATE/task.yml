name: Task
description: A general task or chore (refactoring, maintenance, etc.)
title: "chore: "
labels: ["chore", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe this repository's problem, evidence, and completion criteria.
        Explain why any external project or source is relevant to the work here.
        See [Repository scope](https://github.com/yeongseon/azure-functions-openapi-python/blob/main/AGENTS.md#repository-scope).
  - type: markdown
    attributes:
      value: |
        Use this template for maintenance tasks, refactoring, or other chores.

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What maintenance or chore this issue addresses, why now, and the current situation.
      placeholder: What needs maintenance or cleanup, why now, and what is the current situation?
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: Tasks
      description: State the required work explicitly as actionable items.
      placeholder: |
        - [ ] Task 1
        - [ ] Task 2
    validations:
      required: true

  - type: textarea
    id: acceptance-checklist
    attributes:
      label: Acceptance Checklist
      description: Concrete, verifiable items. Use checkboxes - each one should be something a reviewer can confirm is done.
      placeholder: |
        - [ ] The maintenance goal is met and a reviewer can confirm it
        - [ ] `make check-all` passes
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: References
      description: Any related files, documentation, or resources
    validations:
      required: false
