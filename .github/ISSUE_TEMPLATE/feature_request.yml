name: Feature Request
description: Suggest a new feature or enhancement
title: "feat: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Describe this repository's problem, evidence, and completion criteria.
        Explain why any external project or source is relevant to the work here.
        See [Repository scope](https://github.com/yeongseon/azure-functions-openapi-python/blob/main/AGENTS.md#repository-scope).
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature!

  - type: textarea
    id: context
    attributes:
      label: Context
      description: What problem or gap this addresses, why it matters now, and current behavior or limitations.
      placeholder: What is missing or limited, why does it matter, and how does the project currently handle it?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: State the required change explicitly. Avoid pasting a complete implementation when a concise description suffices.
      placeholder: Describe the desired capability and required changes.
    validations:
      required: true

  - type: textarea
    id: acceptance-checklist
    attributes:
      label: Acceptance Checklist
      description: Concrete, outcome-focused items. Use checkboxes - each one should be something a reviewer can confirm is done.
      placeholder: |
        - [ ] The new behavior works as described in Proposed Solution
        - [ ] Tests cover the new behavior
        - [ ] Documentation and examples are updated
        - [ ] `make check-all` passes
    validations:
      required: true

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Items intentionally excluded from this work
      placeholder: |
        - Non-goals or deferred enhancements
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: Any related issues, PRs, documentation, or examples
    validations:
      required: false
